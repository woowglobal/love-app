<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>LorVe</title>

<!-- আপনার app-এর লিংক বসানো আছে — এই ফাইলে কিছু বদলাতে হবে না -->
<script>var APP_URL = "https://script.google.com/macros/s/AKfycbxhneggmmFF9ob21e4r5bkoXlv5Kesx2eFOXaVgtKEOOC_uMDbyPSoJsshniApUmrh0/exec";</script>


<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0f">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LorVe">
<meta name="mobile-web-app-capable" content="yes">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0d0f;
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Noto Sans Bengali",Roboto,sans-serif;color:#fff;
    overscroll-behavior:none}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f4f7;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(700px 420px at 70% 10%,rgba(10,132,255,.35),transparent 60%),#0d0d0f;z-index:9;transition:opacity .45s}
  #splash.gone{opacity:0;pointer-events:none}
  .logo{width:78px;height:78px;border-radius:20px;background:linear-gradient(140deg,#0A84FF,#5E5CE6);
    display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;letter-spacing:-1px;
    box-shadow:0 20px 50px -20px rgba(10,132,255,.9)}
  .nm{font-size:19px;font-weight:700;letter-spacing:.3px}
  .sb{font-size:12px;color:#8e8e93}
  .spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #tip{position:fixed;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(28,28,30,.96);
    backdrop-filter:blur(14px);border-radius:16px;padding:14px 16px;font-size:13px;z-index:20;display:none;
    box-shadow:0 20px 40px -20px #000}
  #tip b{color:#0A84FF}
  #tip button{margin-top:10px;background:#fff;color:#000;border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-family:inherit}
</style>
</head>
<body>

<div id="splash">
  <div class="logo">L</div>
  <div style="text-align:center">
    <div class="nm">LorVe</div>
    <div class="sb">Business Control</div>
  </div>
  <div class="spin"></div>
</div>

<iframe id="frame" allow="clipboard-write; camera; geolocation" referrerpolicy="origin"></iframe>

<div id="tip"></div>

<script>
(function () {
  var f = document.getElementById('frame'), sp = document.getElementById('splash');
  if (!APP_URL || APP_URL.indexOf('PASTE') === 0) {
    sp.innerHTML = '<div style="padding:26px;text-align:center;font-size:14px;line-height:1.7">' +
      'index.html খুলে উপরে <b style="color:#0A84FF">APP_URL</b>-এ আপনার Apps Script<br>web app-এর <b>/exec</b> লিংকটা বসান।</div>';
    return;
  }
  f.src = APP_URL;
  f.onload = function () { setTimeout(function () { sp.classList.add('gone'); }, 500); };
  setTimeout(function () { sp.classList.add('gone'); }, 9000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  }

  // "Add to Home Screen" সাহায্য
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  var tip = document.getElementById('tip'), shown = 'lorve_tip';
  function show(html) {
    if (standalone || localStorage.getItem(shown)) return;
    tip.innerHTML = html + '<button onclick="this.parentNode.style.display=\'none\';localStorage.setItem(\'' + shown + '\',1)">বুঝেছি</button>';
    tip.style.display = 'block';
  }
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    tip.innerHTML = '<b>LorVe ইনস্টল করুন</b><br>ফোনে app-এর মতো খুলবে, address bar থাকবে না।' +
      '<button id="inst">ইনস্টল করুন</button>';
    tip.style.display = 'block';
    document.getElementById('inst').onclick = function () { tip.style.display = 'none'; e.prompt(); };
  });
  if (isIOS) setTimeout(function () {
    show('<b>Home screen-এ যোগ করুন</b><br>নিচে <b>শেয়ার</b> আইকন ⬆️ চাপুন → <b>Add to Home Screen</b> → Add');
  }, 3000);
})();
</script>
</body>
</html>
