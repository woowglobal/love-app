<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>LorVe</title>
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LorVe">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1d1d1f;--sub:#86868b;--line:#e5e5ea;--bg:#f5f5f7;--accent:#0a84ff;--green:#248a3d;--red:#d70015;--orange:#b25000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Noto Sans Bengali",sans-serif;
  background:radial-gradient(900px 420px at 90% -10%,rgba(10,132,255,.10),transparent 60%),radial-gradient(800px 400px at -10% 10%,rgba(191,90,242,.08),transparent 60%),linear-gradient(#fbfbfd,#f4f4f7);
  background-attachment:fixed;min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;overflow:hidden;
  background:linear-gradient(120deg,#000,#1d1d1f 55%,#2b2b31);display:flex;justify-content:space-between;align-items:center}
header::after{content:"";position:absolute;right:-60px;top:-100px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.5),transparent 70%);filter:blur(10px)}
header>*{position:relative;z-index:1}
header .co{font-size:17px;font-weight:700;letter-spacing:-.3px}
header .who{font-size:11px;color:#a1a1a6}
.wrap{max-width:860px;margin:0 auto;padding:14px 12px}
.card{background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.04);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 8px 24px -18px rgba(0,0,0,.35)}
.item{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 6px 18px -16px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center;cursor:pointer}
.item .b{flex:1;min-width:0}
.t{font-weight:600}
.m{font-size:12px;color:var(--sub);margin-top:2px}
.sec-t{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:16px 4px 8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
label{display:block;font-size:11px;font-weight:600;color:var(--sub);margin:10px 0 4px;text-transform:uppercase}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:#fff;font-family:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
button{font-family:inherit;font-size:15px;font-weight:600;border:0;border-radius:11px;padding:12px 16px;background:var(--ink);color:#fff;cursor:pointer}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.small{padding:7px 12px;font-size:13px}
button.wa{background:#25D366}
button.red{background:var(--red)}
button:active,.item:active{transform:scale(.98)}
.full{width:100%}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px}
.chips button{background:#fff;color:var(--sub);border:1px solid var(--line);padding:8px 13px;font-size:13px;border-radius:99px;white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{border-radius:18px;padding:14px;color:#fff;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-40px;top:-50px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.15)}
.kpi .l{font-size:11px;opacity:.9;font-weight:600;position:relative}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px;position:relative}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--sub);white-space:nowrap}
.pill.ok{background:#e6f5ec;color:var(--green)}.pill.low{background:#fff3e5;color:var(--orange)}.pill.out{background:#fdecee;color:var(--red)}.pill.b{background:#e8f2ff;color:var(--accent)}
.thumb{width:46px;height:46px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 46px;object-fit:cover}
.green{color:var(--green)}.red{color:var(--red)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);z-index:30;
  background:rgba(252,252,253,.92);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);
  border-top:1px solid var(--line);padding:7px 4px calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;color:var(--sub);font-size:10px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button .i{font-size:20px}
nav button.on{color:var(--ink)}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.moregrid button{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.moregrid .i{font-size:24px}
.login{max-width:370px;margin:10vh auto 0;padding:0 18px}
.err{background:#fdecee;color:var(--red);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px calc(26px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:60;max-width:90vw;text-align:center}
.speed{position:fixed;right:10px;top:calc(64px + env(safe-area-inset-top));font-size:10px;background:rgba(0,0,0,.7);color:#6bff9a;padding:3px 8px;border-radius:99px;z-index:25}
.line{border-bottom:1px solid var(--line);padding:10px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10px;color:var(--sub);text-transform:uppercase}
td.n,th.n{text-align:right}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<!-- ═════════ LOGIN ═════════ -->
<div id="login" class="login">
  <div style="text-align:center;margin-bottom:18px">
    <div style="font-size:28px;font-weight:800;letter-spacing:-.6px">LorVe</div>
    <div style="color:var(--sub);font-size:13px">Business Control</div>
  </div>
  <div class="card" id="lg-box">
    <label>Email</label><input id="lg-email" type="email" autocomplete="username">
    <label>Password</label><input id="lg-pass" type="password" autocomplete="current-password">
    <div style="margin-top:14px"><button id="lg-btn" class="full">Login</button></div>
    <div id="lg-err" class="err hide"></div>
    <div class="between" style="margin-top:14px;font-size:13px">
      <a href="#" onclick="forgot();return false" style="color:var(--accent);text-decoration:none">Password ভুলে গেছেন?</a>
      <a href="#" onclick="signupForm();return false" style="color:var(--accent);text-decoration:none">নতুন কর্মী?</a>
    </div>
  </div>
</div>

<!-- ═════════ APP ═════════ -->
<div id="app" class="hide">
  <header>
    <div><div class="co" id="h-co">LorVe</div><div class="who" id="h-who"></div></div>
    <button class="small sec" onclick="logout()">Logout</button>
  </header>
  <div class="speed hide" id="speed"></div>
  <div class="wrap" id="view"></div>
  <nav id="nav"></nav>
</div>

<script>
/* ═══════════════════ সংযোগ ═══════════════════ */
var SUPABASE_URL = 'https://tgpyvfrchfirwgpijlif.supabase.co';
var SUPABASE_KEY = 'sb_publishable_Ef_qMomdNTGYd1DtHUoC5A_CuBIguaJ';
var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'lorve' } });

var S = { user:null, staff:null, view:'home', period:'today',
  products:[], customers:[], suppliers:[], accounts:[], settings:{} };

var SCREENS = {
  home:{i:'🏠',t:'Home'}, sale:{i:'➕',t:'বিক্রি'}, orders:{i:'🧾',t:'অর্ডার'}, stock:{i:'📦',t:'স্টক'},
  buy:{i:'🛒',t:'Import'}, delivery:{i:'🚚',t:'ডেলিভারি'}, money:{i:'💳',t:'টাকা'}, people:{i:'👥',t:'মানুষ'},
  report:{i:'📈',t:'রিপোর্ট'}, settings:{i:'⚙️',t:'সেটিংস'}
};
var BOARDS = {
  'Admin board':     ['home','sale','orders','stock','buy','delivery','money','people','report','settings'],
  'Manager board':   ['home','sale','orders','stock','buy','delivery','money','people','report'],
  'Seller board':    ['home','sale','orders','delivery','people'],
  'Account board':   ['home','money','orders','people','report'],
  'Warehouse board': ['stock','buy','orders','delivery'],
  'Purchase board':  ['buy','stock','people','money'],
  'Delivery board':  ['delivery','orders']
};
var METHODS = ['Cash','bKash','Nagad','Bank Transfer','Card','COD'];
var COURIERS = ['Steadfast','REDX','Pathao','Own Delivery'];
var ORDER_STATUS = ['Pending','Confirmed','Packed','Shipped','Delivered','Returned','Cancelled'];
var DLV_STATUS = ['Pending','Picked','In Transit','Delivered','Partial','Failed','Returned'];

/* ═══════════════════ helpers ═══════════════════ */
function el(id){ return document.getElementById(id); }
function val(id){ var e=el(id); return e ? e.value.trim() : ''; }
function num(id){ return Number(val(id)) || 0; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ n=Math.round(Number(n)||0); return (n<0?'-':'')+'৳'+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function k(n){ n=Number(n)||0; if(Math.abs(n)>=100000) return '৳'+(n/100000).toFixed(1)+'L'; if(Math.abs(n)>=1000) return '৳'+(n/1000).toFixed(1)+'K'; return money(n); }
function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function monthStart(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; }
function nice(d){ if(!d) return ''; var x=new Date(d); return x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function opts(list, sel, blank){ return (blank?'<option value="">'+blank+'</option>':'')+list.map(function(x){ var v=typeof x==='object'?x.v:x, t=typeof x==='object'?x.t:x; return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(t)+'</option>'; }).join(''); }
function toast(t){ var d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(function(){ d.remove(); },3000); }
function fail(e){ toast('⚠️ '+(e && e.message ? e.message : e)); console.error(e); }
function waPhone(p){ p=String(p||'').replace(/\D/g,''); if(!p) return ''; if(p.indexOf('880')===0) return p; if(p[0]==='0') return '880'+p.slice(1); return p; }
function openWA(phone,text){ var p=waPhone(phone); window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text),'_blank'); }

async function q(label, promise){
  var t0=performance.now(), r=await promise, ms=Math.round(performance.now()-t0);
  var s=el('speed'); if(s){ s.textContent=label+' · '+ms+'ms'; s.classList.remove('hide'); clearTimeout(S.sp); S.sp=setTimeout(function(){ s.classList.add('hide'); },2200); }
  if(r.error) throw r.error;
  return r.data;
}
function modal(html){ closeModal(); var d=document.createElement('div'); d.className='modal'; d.id='modal';
  d.innerHTML='<div class="sheet"><div style="text-align:right;margin-bottom:6px"><button class="small sec" onclick="closeModal()">✕ বন্ধ</button></div>'+html+'</div>';
  d.onclick=function(e){ if(e.target===d) closeModal(); }; document.body.appendChild(d); }
function closeModal(){ var x=el('modal'); if(x) x.remove(); }
function prodName(sku){ var p=S.products.filter(function(x){return x.sku===sku;})[0]; return p?p.name:sku; }
function isAdmin(){ return S.staff && S.staff.board==='Admin board'; }

/* ═══════════════════ AUTH ═══════════════════ */
el('lg-btn').onclick = async function(){
  el('lg-err').classList.add('hide');
  var r = await db.auth.signInWithPassword({ email: val('lg-email'), password: el('lg-pass').value });
  if (r.error){ showErr('Email বা password ভুল'); return; }
  start();
};
el('lg-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') el('lg-btn').click(); });
function showErr(m){ el('lg-err').innerHTML=m; el('lg-err').classList.remove('hide'); }
async function logout(){ await db.auth.signOut(); location.reload(); }

async function forgot(){
  var e = val('lg-email') || prompt('আপনার email:');
  if(!e) return;
  var r = await db.auth.resetPasswordForEmail(e, { redirectTo: location.href.split('#')[0] });
  if(r.error) showErr(r.error.message); else toast('📧 ইমেইলে লিংক পাঠানো হয়েছে');
}
db.auth.onAuthStateChange(async function(event){
  if(event === 'PASSWORD_RECOVERY'){
    var np = prompt('নতুন password দিন (অন্তত ৬ অক্ষর):');
    if(np){ var r = await db.auth.updateUser({ password: np }); toast(r.error ? '⚠️ '+r.error.message : '✅ Password বদলে গেছে'); }
  }
});
function signupForm(){
  el('lg-box').innerHTML =
    '<b>নতুন কর্মী account</b><div class="m">account খোলার পরে Admin চালু করে দিলে ঢুকতে পারবেন</div>'+
    '<label>আপনার নাম</label><input id="su-name">'+
    '<label>Email</label><input id="su-email" type="email">'+
    '<label>Password (৬+ অক্ষর)</label><input id="su-pass" type="password">'+
    '<div style="margin-top:14px"><button class="full" onclick="signup()">Account খুলুন</button></div>'+
    '<div id="lg-err" class="err hide"></div>'+
    '<div style="margin-top:12px;text-align:center"><a href="" style="color:var(--accent);font-size:13px">← Login-এ ফিরুন</a></div>';
}
async function signup(){
  var r = await db.auth.signUp({ email: val('su-email'), password: el('su-pass').value });
  if(r.error){ showErr(r.error.message); return; }
  if(r.data.session){ await db.rpc('request_access', { p_name: val('su-name') }); }
  showErr('✅ Account খোলা হয়েছে। Admin চালু করে দিলে login করতে পারবেন।'+(r.data.session?'':' (ইমেইলে confirm লিংক থাকলে সেটা আগে চাপুন)'));
}

async function start(){
  var s = await db.auth.getSession();
  if(!s.data.session){ el('login').classList.remove('hide'); el('app').classList.add('hide'); return; }
  S.user = s.data.session.user;
  var st = await db.from('staff').select('*').eq('id', S.user.id).maybeSingle();
  if(!st.data){ await db.rpc('request_access', { p_name: S.user.email.split('@')[0] }); st = await db.from('staff').select('*').eq('id', S.user.id).maybeSingle(); }
  if(!st.data || st.data.status !== 'Active'){
    el('login').classList.remove('hide'); el('app').classList.add('hide');
    showErr('🔒 আপনার account এখনো চালু হয়নি — Admin-কে বলুন।<br><a href="#" onclick="logout();return false">Logout</a>');
    return;
  }
  S.staff = st.data;
  el('login').classList.add('hide'); el('app').classList.remove('hide');
  el('h-who').textContent = (S.staff.name || S.staff.email) + ' · ' + S.staff.board;
  db.rpc('touch_login').then(function(){});
  await loadMaster();
  buildNav();
  go(myScreens()[0]);
}
async function loadMaster(){
  var r = await Promise.all([
    db.from('v_stock').select('*').order('name'),
    db.from('customers').select('*').eq('active',true).order('name'),
    db.from('suppliers').select('*').eq('active',true).order('name'),
    db.from('accounts').select('*').eq('active',true).order('name'),
    db.from('settings').select('*')
  ]);
  S.products = r[0].data || []; S.customers = r[1].data || []; S.suppliers = r[2].data || []; S.accounts = r[3].data || [];
  S.settings = {}; (r[4].data || []).forEach(function(x){ S.settings[x.key] = x.value; });
  el('h-co').textContent = S.settings.company_name || 'LorVe';
}

/* ═══════════════════ NAV ═══════════════════ */
function myScreens(){ var s = S.staff.screens && S.staff.screens.length ? S.staff.screens : (BOARDS[S.staff.board] || BOARDS['Seller board']); return s; }
function buildNav(){
  var s = myScreens(), main = s.slice(0,4), more = s.slice(4);
  el('nav').innerHTML = main.map(function(id){ return '<button data-v="'+id+'" onclick="go(\''+id+'\')"><span class="i">'+SCREENS[id].i+'</span>'+SCREENS[id].t+'</button>'; }).join('') +
    (more.length ? '<button data-v="_more" onclick="moreMenu()"><span class="i">⋯</span>আরও</button>' : '');
  el('nav').style.gridTemplateColumns = 'repeat('+(main.length+(more.length?1:0))+',1fr)';
}
function moreMenu(){
  var more = myScreens().slice(4);
  modal('<h3 style="margin:0 0 12px">সব স্ক্রিন</h3><div class="moregrid">'+more.map(function(id){
    return '<button onclick="closeModal();go(\''+id+'\')"><span class="i">'+SCREENS[id].i+'</span>'+SCREENS[id].t+'</button>'; }).join('')+'</div>');
}
function go(v){
  S.view = v; closeModal();
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.v===v); });
  window.scrollTo(0,0);
  ({home:vHome,sale:vSale,orders:vOrders,stock:vStock,buy:vBuy,delivery:vDelivery,money:vMoney,people:vPeople,report:vReport,settings:vSettings})[v]();
}
function range(){ var p=S.period; return p==='today'?[today(),today()]:(p==='week'?[daysAgo(6),today()]:(p==='month'?[monthStart(),today()]:[daysAgo(29),today()])); }
function chips(fn){ return '<div class="chips">'+[['today','আজ'],['week','৭ দিন'],['month','এই মাস'],['30','৩০ দিন']].map(function(c){
  return '<button class="'+(S.period===c[0]?'on':'')+'" onclick="S.period=\''+c[0]+'\';'+fn+'()">'+c[1]+'</button>'; }).join('')+'</div>'; }

/* ═══════════════════ HOME ═══════════════════ */
async function vHome(){
  el('view').innerHTML = chips('vHome') + '<div id="hb" class="m">লোড হচ্ছে…</div>';
  try{
    var r = range();
    var o = await q('হিসাব', db.from('v_orders').select('id,status,grand_total,profit,due').gte('order_date', r[0]).lte('order_date', r[1]));
    var live = o.filter(function(x){ return ['Cancelled','Returned'].indexOf(x.status)<0; });
    var sales = live.reduce(function(a,x){return a+(+x.grand_total||0);},0);
    var profit = live.reduce(function(a,x){return a+(+x.profit||0);},0);
    var allDue = await q('বাকি', db.from('v_orders').select('due').gt('due',0));
    var due = allDue.reduce(function(a,x){return a+(+x.due||0);},0);
    var low = S.products.filter(function(x){return x.stock_status!=='OK';});
    var value = S.products.reduce(function(a,x){return a+Math.max(0,x.stock)*(+x.cost_price||0);},0);
    el('hb').innerHTML = '<div class="kpis">'+
      kpi('💰 বিক্রি', k(sales), 'linear-gradient(135deg,#0A84FF,#0060df)')+
      kpi('🧾 অর্ডার', live.length, 'linear-gradient(135deg,#5E5CE6,#3634a3)')+
      kpi('📈 লাভ', k(profit), 'linear-gradient(135deg,#30D158,#1a8c3a)')+
      kpi('🔴 কাস্টমার বাকি', k(due), 'linear-gradient(135deg,#FF453A,#b3261e)')+'</div>'+
      '<div class="card"><div class="between"><span class="m">স্টক ভ্যালু</span><b>'+money(value)+'</b></div>'+
      '<div class="between" style="margin-top:6px"><span class="m">প্রোডাক্ট</span><b>'+S.products.length+'</b></div></div>'+

var LINES = [];
function vSale(){

    '<select id="s-cust" style="margin-top:8px">'+opts(S.customers.map(function(c){return {v:c.id,t:c.name+' · '+(c.phone||'')};}),'','— বেছে নিন —')+'</select>'+
    '<div class="row"><div><label>চ্যানেল</label><select id="s-ch">'+opts(['Facebook','WhatsApp','Website','Shop','Wholesale'])+'</select></div>'+
    '<div><label>স্ট্যাটাস</label><select id="s-st">'+opts(ORDER_STATUS,'Confirmed')+'</select></div></div></div>'+
    '<div class="card"><div class="between"><b>প্রোডাক্ট</b><button class="small sec" onclick="LINES.push({sku:\'\',qty:1,price:0});drawLines()">+ লাইন</button></div><div id="lines"></div></div>'+
    '<div class="card"><div class="row"><div><label>ডিসকাউন্ট</label><input id="s-disc" inputmode="decimal" value="0" oninput="calcSale()"></div>'+
    '<div><label>ডেলিভারি চার্জ</label><input id="s-dc" inputmode="decimal" value="0" oninput="calcSale()"></div></div>'+
    '<div class="row"><div><label>অগ্রিম</label><input id="s-adv" inputmode="decimal" placeholder="0" oninput="calcSale()"></div>'+
    '<div><label>মাধ্যম</label><select id="s-m">'+opts(METHODS,'bKash')+'</select></div>'+
    '<div><label>অ্যাকাউন্ট</label><select id="s-acc">'+opts(S.accounts.map(function(a){return a.name;}))+'</select></div></div>'+
    '<div class="row"><div><label>কুরিয়ার</label><select id="s-cour">'+opts(COURIERS,'','— পরে —')+'</select></div>'+
    '<div><label>ট্র্যাকিং</label><input id="s-trk"></div></div>'+
    '<div id="s-tot" style="margin-top:12px"></div></div>'+
    '<div class="row" style="margin-bottom:20px"><button class="sec" onclick="saveSale(false)">সেভ</button><button onclick="saveSale(true)">সেভ + ইনভয়েস 🧾</button></div>';
  drawLines();
}
function drawLines(){
  el('lines').innerHTML = LINES.map(function(l,i){
    return '<div class="line"><select onchange="setLine('+i+',this.value)">'+opts(S.products.map(function(p){return {v:p.sku,t:p.name+' · '+money(p.sale_price)+' · স্টক '+p.stock};}),l.sku,'— প্রোডাক্ট —')+'</select>'+
      '<div class="row" style="margin-top:6px"><input inputmode="numeric" value="'+l.qty+'" placeholder="Qty" oninput="LINES['+i+'].qty=+this.value||0;calcSale()">'+
      '<input inputmode="decimal" value="'+l.price+'" placeholder="দাম" oninput="LINES['+i+'].price=+this.value||0;calcSale()">'+
      '<button class="small sec" style="flex:0 0 44px" onclick="LINES.splice('+i+',1);if(!LINES.length)LINES.push({sku:\'\',qty:1,price:0});drawLines()">✕</button></div></div>';
  }).join('');
  calcSale();
}
function setLine(i,sku){ var p=S.products.filter(function(x){return x.sku===sku;})[0]; LINES[i].sku=sku; if(p) LINES[i].price=+p.sale_price||0; drawLines(); }
function calcSale(){
  var items=LINES.reduce(function(a,l){return a+l.qty*l.price;},0), tot=items-num('s-disc')+num('s-dc'), adv=num('s-adv');
  el('s-tot').innerHTML='<div class="between"><span class="m">আইটেম</span><span>'+money(items)+'</span></div>'+
    '<div class="between" style="font-size:18px;margin-top:4px"><b>মোট</b><b>'+money(tot)+'</b></div>'+
    '<div class="between"><b>বাকি</b><b class="'+(tot-adv>0?'red':'green')+'">'+money(tot-adv)+'</b></div>';
}
async function saveSale(inv){
  var items=LINES.filter(function(l){return l.sku&&l.qty>0;});
  if(!val('s-cust')){ toast('কাস্টমার বেছে নিন'); return; }
  if(!items.length){ toast('প্রোডাক্ট দিন'); return; }
  try{
    var o = await q('অর্ডার', db.from('orders').insert({ customer_id:val('s-cust'), channel:val('s-ch'), status:val('s-st'),
      discount:num('s-disc'), delivery_charge:num('s-dc'), salesperson:S.staff.name||S.staff.email, created_by:S.user.id }).select().single());
    await q('লাইন', db.from('order_items').insert(items.map(function(l){ return { order_id:o.id, sku:l.sku, qty:l.qty, unit_price:l.price }; })));
    if(num('s-adv')>0) await q('পেমেন্ট', db.from('payments').insert({ kind:'Customer Receipt', doc_id:o.id, party_id:val('s-cust'), method:val('s-m'), account:val('s-acc'), amount:num('s-adv'), received_by:S.staff.email }));
    if(val('s-cour')){
      var v = await q('মোট', db.from('v_orders').select('due').eq('id',o.id).single());
      await q('ডেলিভারি', db.from('deliveries').insert({ order_id:o.id, courier:val('s-cour'), tracking_no:val('s-trk'), cod_amount:Math.max(0,+v.due||0) }));
    }
    toast('✅ '+o.id+' সেভ হয়েছে');
    refreshProducts();
    if(inv) printInvoice(o.id); else vSale();
  }catch(e){ fail(e); }
}
async function refreshProducts(){ var r=await db.from('v_stock').select('*').order('name'); if(!r.error) S.products=r.data; }
async function quickCustomer(){
  var n=prompt('কাস্টমারের নাম:'); if(!n) return;
  var p=prompt('ফোন:')||'';
  try{ var c=await q('কাস্টমার', db.from('customers').insert({name:n,phone:p}).select().single());
    S.customers.push(c); S.customers.sort(function(a,b){return a.name.localeCompare(b.name);});
    el('s-cust').innerHTML=opts(S.customers.map(function(x){return {v:x.id,t:x.name+' · '+(x.phone||'')};}),c.id,'— বেছে নিন —');
    toast('✅ '+c.id); }catch(e){ fail(e); }
}

function productForm(p){
  p=p||{};
  return '<div class="card"><label>নাম</label><input id="pp-name" value="'+esc(p.name||'')+'" placeholder="Fish Oil">'+
    (p.sku?'<div class="m">SKU: <b>'+esc(p.sku)+'</b></div>':'<div class="m">SKU নিজে তৈরি হবে (FIS-001)</div>')+
    '<div class="row"><div><label>বিক্রয় দাম</label><input id="pp-price" inputmode="decimal" value="'+(p.sale_price||'')+'"></div>'+
    '<div><label>ওজন (গ্রাম)</label><input id="pp-w" inputmode="numeric" value="'+(p.unit_weight_g||'')+'"></div></div>'+
    '<div class="row"><div><label>রিঅর্ডার লেভেল</label><input id="pp-re" inputmode="numeric" value="'+(p.reorder_level||10)+'"></div>'+
    (p.sku?'':'<div><label>বর্তমান স্টক</label><input id="pp-open" inputmode="numeric" value="0"></div>')+'</div>'+
    '<label>ছবির লিংক (ঐচ্ছিক)</label><input id="pp-img" value="'+esc(p.image_url||'')+'" placeholder="https://…jpg">'+
    '<label>পণ্যের ওয়েব লিংক (ঐচ্ছিক)</label><input id="pp-link" value="'+esc(p.web_link||'')+'" placeholder="https://amazon.com/…">'+'</div>';
}
function formProduct(){ modal('<h3 style="margin:0 0 10px">নতুন প্রোডাক্ট</h3>'+productForm()+'<button class="full" onclick="saveProduct()">সেভ</button>'); }
async function saveProduct(){
  if(!val('pp-name')){ toast('নাম দিন'); return; }
  try{ var r=await q('সেভ', db.from('products').insert({name:val('pp-name'),sale_price:num('pp-price'),unit_weight_g:num('pp-w')||null,reorder_level:num('pp-re')||10,
      opening_stock:num('pp-open'),image_url:val('pp-img')||null,web_link:val('pp-link')||null}).select('sku').single());
    closeModal(); toast('✅ '+r.sku); await refreshProducts(); if(S.view==='stock') drawStock(); return r.sku; }catch(e){ fail(e); }
}
function editProduct(sku){
  var p=S.products.filter(function(x){return x.sku===sku;})[0]; if(!p) return;
  modal('<h3 style="margin:0 0 10px">'+esc(p.name)+'</h3>'+productForm(p)+
    '<div class="row"><button onclick="updateProduct(\''+esc(sku)+'\')">সেভ</button>'+(isAdmin()?'<button class="red" onclick="hideProduct(\''+esc(sku)+'\')">সরান</button>':'')+'</div>');
}
async function updateProduct(sku){
  try{ await q('সেভ', db.from('products').update({name:val('pp-name'),sale_price:num('pp-price'),unit_weight_g:num('pp-w')||null,reorder_level:num('pp-re')||10,
      image_url:val('pp-img')||null,web_link:val('pp-link')||null}).eq('sku',sku));
    closeModal(); toast('✅ আপডেট'); await refreshProducts(); drawStock(); }catch(e){ fail(e); }
}
async function hideProduct(sku){ if(!confirm('প্রোডাক্ট তালিকা থেকে সরাবেন? (তথ্য মুছবে না)')) return;
  try{ await q('সরান', db.from('products').update({active:false}).eq('sku',sku)); closeModal(); await refreshProducts(); drawStock(); }catch(e){ fail(e); } }
function formMove(){
  modal('<h3 style="margin:0 0 10px">স্টক সমন্বয়</h3><div class="card"><label>প্রোডাক্ট</label><select id="mv-sku">'+opts(S.products.map(function(p){return {v:p.sku,t:p.name+' · স্টক '+p.stock};}))+'</select>'+
    '<label>ধরন</label><select id="mv-k">'+opts([{v:'Return In',t:'ফেরত এসেছে (+)'},{v:'Damaged',t:'নষ্ট (−)'},{v:'Adjust +',t:'গণনায় বেশি (+)'},{v:'Adjust -',t:'গণনায় কম (−)'}])+'</select>'+
    '<label>পরিমাণ</label><input id="mv-q" inputmode="numeric"><label>নোট</label><input id="mv-n"></div><button class="full" onclick="saveMove()">সেভ</button>');

async function saveMove(){ if(!num('mv-q')){ toast('পরিমাণ দিন'); return; }

async function vBuy(){
  el('view').innerHTML='<div class="row" style="margin-bottom:12px"><button onclick="formShipment()">➕ নতুন Shipment</button></div><div id="bl" class="m">লোড হচ্ছে…</div>';
  try{
    var sh=await q('Shipment', db.from('shipments').select('*').order('created_at',{ascending:false}).limit(40));
    var lines=await q('লাইন', db.from('v_shipment_lines').select('shipment_id,goods_bdt,shipping_bdt,line_weight_kg'));
    var agg={}; lines.forEach(function(l){ var a=agg[l.shipment_id]||(agg[l.shipment_id]={g:0,s:0,w:0,n:0}); a.g+=+l.goods_bdt||0; a.s+=+l.shipping_bdt||0; a.w+=+l.line_weight_kg||0; a.n++; });
    el('bl').innerHTML = sh.length ? sh.map(function(s){ var a=agg[s.id]||{g:0,s:0,w:0,n:0}, imp=S.suppliers.filter(function(x){return x.id===s.importer_id;})[0];
      var c=s.status==='Received'?'ok':(s.status==='Cancelled'?'out':'b');
      return '<div class="item" onclick="openShipment(\''+s.id+'\')"><div class="b"><div class="between"><span class="t">'+esc(s.shipment_no)+'</span><span class="pill '+c+'">'+esc(s.status)+'</span></div>'+
        '<div class="m">'+esc(imp?imp.name:'')+' · '+a.n+' আইটেম · '+a.w.toFixed(2)+'kg · '+money(s.rate_per_kg)+'/kg</div>'+
        '<div class="between"><span class="m">'+nice(s.order_date)+'</span><b>'+money(a.g+a.s)+'</b></div></div></div>'; }).join('')
      : '<div class="card m">এখনো কোনো shipment নেই</div>';
  }catch(e){ el('bl').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
}
var SL=[];
function formShipment(){
  SL=[{sku:'',qty:1,price:0,g:0,link:''}];
  var imps=S.suppliers.map(function(s){return {v:s.id,t:s.name};});
  modal('<h3 style="margin:0 0 10px">নতুন Shipment</h3>'+
    '<div class="card"><div class="row"><div><label>Shipment No</label><input id="sh-no" placeholder="WOOW-15"></div>'+
    '<div><label>কেজি রেট (৳/kg)</label><input id="sh-rate" inputmode="decimal" placeholder="3000" oninput="calcShip()"></div></div>'+
    '<label>Importer <a href="#" onclick="quickSupplier();return false" style="color:var(--accent);text-decoration:none">+ নতুন</a></label><select id="sh-imp">'+opts(imps,'','— বেছে নিন —')+'</select>'+
    '<div class="row"><div><label>দেশ</label><input id="sh-or" value="USA"></div><div><label>ডলার রেট</label><input id="sh-fx" inputmode="decimal" value="'+(S.settings.fx_usd||122)+'" oninput="calcShip()"></div></div></div>'+
    '<div class="card"><div class="between"><b>প্রোডাক্ট</b><span><button class="small sec" onclick="quickProduct()">➕ নতুন</button> <button class="small sec" onclick="SL.push({sku:\'\',qty:1,price:0,g:0,link:\'\'});drawSL()">+ লাইন</button></span></div><div id="sl-lines"></div></div>'+
    '<div class="card" id="sh-calc"></div>'+
    '<button class="full" onclick="saveShipment()">📋 অর্ডার হিসেবে সেভ</button>');
  drawSL();
}
function drawSL(){
  el('sl-lines').innerHTML=SL.map(function(l,i){
    return '<div class="line"><select onchange="SL['+i+'].sku=this.value;var p=S.products.filter(function(x){return x.sku===SL['+i+'].sku})[0];if(p&&p.unit_weight_g&&!SL['+i+'].g)SL['+i+'].g=+p.unit_weight_g;drawSL()">'+
      opts(S.products.map(function(p){return {v:p.sku,t:p.name+' · '+p.sku};}),l.sku,'— প্রোডাক্ট —')+'</select>'+
      '<div class="row" style="margin-top:6px"><input inputmode="numeric" value="'+l.qty+'" placeholder="Qty" oninput="SL['+i+'].qty=+this.value||0;calcShip()">'+
      '<input inputmode="decimal" value="'+l.price+'" placeholder="দাম $" oninput="SL['+i+'].price=+this.value||0;calcShip()">'+
      '<input inputmode="numeric" value="'+(l.g||'')+'" placeholder="গ্রাম" oninput="SL['+i+'].g=+this.value||0;calcShip()">'+
      '<button class="small sec" style="flex:0 0 42px" onclick="SL.splice('+i+',1);if(!SL.length)SL.push({sku:\'\',qty:1,price:0,g:0,link:\'\'});drawSL()">✕</button></div>'+
      '<input style="margin-top:6px" value="'+esc(l.link)+'" placeholder="🔗 পণ্যের লিংক" oninput="SL['+i+'].link=this.value"></div>';
  }).join('');
  calcShip();
}
function calcShip(){
  var fx=num('sh-fx')||1, rate=num('sh-rate'), goods=0, kg=0;
  SL.forEach(function(l){ goods+=l.qty*l.price*fx; kg+=l.qty*l.g/1000; });
  el('sh-calc').innerHTML='<div class="between"><span class="m">পণ্যের দাম</span><span>'+money(goods)+'</span></div>'+
    '<div class="between"><span class="m">মোট ওজন</span><span>'+kg.toFixed(2)+' kg</span></div>'+
    '<div class="between"><span class="m">আনার খরচ ('+money(rate)+'/kg)</span><span>'+money(kg*rate)+'</span></div>'+
    '<div class="between" style="margin-top:6px;font-size:17px"><b>মোট landed</b><b>'+money(goods+kg*rate)+'</b></div>'+
    SL.filter(function(l){return l.sku&&l.qty;}).map(function(l){ var u=(l.qty*l.price*fx+l.qty*l.g/1000*rate)/l.qty, p=S.products.filter(function(x){return x.sku===l.sku;})[0]||{};
      return '<div class="between m" style="margin-top:4px"><span>'+esc(p.name||l.sku)+'</span><span>'+money(u)+'/pc'+(+p.sale_price?' · লাভ '+money(p.sale_price-u):'')+'</span></div>'; }).join('')+
    '<div class="m" style="margin-top:8px">রিসিভে আসল ওজন মাপলে হিসাব পাকা হবে</div>';
}
async function saveShipment(){
  var items=SL.filter(function(l){return l.sku&&l.qty>0;});
  if(!val('sh-no')){ toast('Shipment No দিন'); return; }
  if(!items.length){ toast('প্রোডাক্ট দিন'); return; }
  try{ var s=await q('Shipment', db.from('shipments').insert({shipment_no:val('sh-no'),importer_id:val('sh-imp')||null,origin:val('sh-or'),fx_rate:num('sh-fx')||122,rate_per_kg:num('sh-rate'),created_by:S.user.id}).select().single());
    await q('লাইন', db.from('shipment_items').insert(items.map(function(l){return {shipment_id:s.id,sku:l.sku,order_qty:l.qty,unit_price_fx:l.price,est_weight_g:l.g||null,web_link:l.link||null};})));
    closeModal(); toast('✅ '+s.shipment_no+' সেভ হয়েছে'); vBuy(); }catch(e){ fail(e); }
}
async function openShipment(id){
  try{ var s=await q('Shipment', db.from('shipments').select('*').eq('id',id).single());
    var L=await q('লাইন', db.from('v_shipment_lines').select('*').eq('shipment_id',id).order('id'));
    var tot=L.reduce(function(a,l){return a+(+l.goods_bdt||0)+(+l.shipping_bdt||0);},0);
    modal('<div class="between"><h3 style="margin:0">'+esc(s.shipment_no)+'</h3><span class="pill b">'+esc(s.status)+'</span></div>'+
      '<div class="m" style="margin-bottom:10px">'+nice(s.order_date)+' · $1 = ৳'+s.fx_rate+' · '+money(s.rate_per_kg)+'/kg</div>'+
      '<div class="card"><table><tr><th>পণ্য</th><th class="n">অর্ডার</th><th class="n">পেয়েছি</th><th class="n">খরচ/pc</th></tr>'+L.map(function(l){
        return '<tr><td>'+esc(prodName(l.sku))+(l.batch_code?'<div class="m">'+esc(l.batch_code)+'</div>':'')+'</td><td class="n">'+l.order_qty+'</td>'+
          '<td class="n '+(l.received_qty!=null&&l.received_qty<l.order_qty?'red':'')+'">'+(l.received_qty==null?'—':l.received_qty)+'</td><td class="n">'+money(l.landed_unit_bdt)+'</td></tr>';}).join('')+'</table>'+
      '<div class="between" style="margin-top:8px"><b>মোট landed</b><b>'+money(tot)+'</b></div></div>'+
      '<div class="row" style="margin-bottom:10px"><button class="wa" onclick="waShipment(\''+id+'\')">💬 অর্ডার লিস্ট</button>'+
      (s.status!=='Received'?'<button onclick="receiveForm(\''+id+'\')">📥 রিসিভ</button>':'')+'</div>');
  }catch(e){ fail(e); }
}
async function waShipment(id){
  var s=await q('Shipment', db.from('shipments').select('*').eq('id',id).single());
  var L=await q('লাইন', db.from('shipment_items').select('*').eq('shipment_id',id).order('id'));
  var tot=0, t='🛒 *'+(S.settings.company_name||'LorVe')+' — '+s.shipment_no+'*\n────────────\n'+L.map(function(l,i){ tot+=l.order_qty*l.unit_price_fx;
    return (i+1)+'. '+prodName(l.sku)+'\n   Qty '+l.order_qty+' × $'+(+l.unit_price_fx).toFixed(2)+' = $'+(l.order_qty*l.unit_price_fx).toFixed(2)+(l.web_link?'\n   '+l.web_link:''); }).join('\n')+
    '\n────────────\nTotal: $'+tot.toFixed(2);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('📋 কপি হয়েছে'); });
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}

  var L=await q('লাইন', db.from('shipment_items').select('*').eq('shipment_id',id).order('id'));

      '<div class="row"><div><label>প্রাপ্ত qty</label><input id="rq-'+l.id+'" inputmode="numeric" value="'+(l.received_qty!=null?l.received_qty:l.order_qty)+'"></div>'+
      '<div><label>মাপা ওজন (গ্রাম/pc)</label><input id="rw-'+l.id+'" inputmode="numeric" value="'+(l.actual_weight_g||l.est_weight_g||'')+'"></div></div>'+
      '<div class="row"><div><label>মেয়াদ</label><input id="re-'+l.id+'" type="date" value="'+(l.expiry_date||'')+'"></div>'+
      '<div><label>নোট</label><input id="rn-'+l.id+'" value="'+esc(l.receive_note||'')+'" placeholder="ভাঙা / কম"></div></div></div>'; }).join('')+

}
async function saveReceive(id, ids){
  try{
    for(var i=0;i<ids.length;i++){ var x=ids[i];
      await q('লাইন', db.from('shipment_items').update({ received_qty:num('rq-'+x), actual_weight_g:num('rw-'+x)||null,
        expiry_date:val('re-'+x)||null, receive_note:val('rn-'+x)||null, batch_code:null }).eq('id',x)); }
    await q('রিসিভ', db.from('shipments').update({status:'Received'}).eq('id',id));
    closeModal(); toast('✅ স্টকে যোগ হয়েছে · খরচ আপডেট'); await refreshProducts(); openShipment(id);
  }catch(e){ fail(e); }
}

      return '<div class="item" onclick="openDlv(\''+x.id+'\')"><div class="b"><div class="between"><span class="t">'+esc(oo.customer_name||x.order_id)+'</span><span class="pill b">'+esc(x.status)+'</span></div>'+

      : '<div class="card m">চলমান কোনো পার্সেল নেই 🎉</div>';

}
async function openDlv(id){
  var d=await q('ডেলিভারি', db.from('deliveries').select('*').eq('id',id).single());
  modal('<h3 style="margin:0 0 10px">'+esc(d.order_id)+'</h3><div class="card"><label>কুরিয়ার</label><select id="dv-c">'+opts(COURIERS,d.courier)+'</select>'+
    '<label>ট্র্যাকিং</label><input id="dv-t" value="'+esc(d.tracking_no||'')+'">'+
    '<div class="row"><div><label>কুরিয়ার ফি</label><input id="dv-f" inputmode="decimal" value="'+(d.courier_fee||0)+'"></div><div><label>COD আদায়</label><input id="dv-cc" inputmode="decimal" placeholder="'+d.cod_amount+'"></div></div>'+
    '<label>স্ট্যাটাস</label><select id="dv-s">'+opts(DLV_STATUS,d.status)+'</select></div><button class="full" onclick="saveDlv(\''+id+'\',\''+d.order_id+'\')">আপডেট</button>');
}
async function saveDlv(id,oid){
  var st=val('dv-s'), up={courier:val('dv-c'),tracking_no:val('dv-t'),courier_fee:num('dv-f'),status:st};
  if(val('dv-cc')) up.cod_collected=num('dv-cc');
  if(st==='Delivered'||st==='Partial') up.delivered_date=today();
  try{ await q('আপডেট', db.from('deliveries').update(up).eq('id',id));
    var map={'Picked':'Shipped','In Transit':'Shipped','Delivered':'Delivered','Partial':'Delivered','Returned':'Returned'};
    if(map[st]) await db.from('orders').update({status:map[st]}).eq('id',oid);
    closeModal(); toast('✅ আপডেট'); vDelivery(); }catch(e){ fail(e); }
}

/* ═══════════════════ মানুষ ═══════════════════ */
var PT='c';
async function vPeople(){
  el('view').innerHTML='<div class="chips"><button class="'+(PT==='c'?'on':'')+'" onclick="PT=\'c\';vPeople()">👤 কাস্টমার</button><button class="'+(PT==='s'?'on':'')+'" onclick="PT=\'s\';vPeople()">🏭 সাপ্লায়ার</button></div>'+
    '<div class="card"><input id="pq" placeholder="🔍 খুঁজুন" oninput="drawPeople()"><button class="small" style="margin-top:10px" onclick="'+(PT==='c'?'formCust()':'formSup()')+'">➕ নতুন</button></div><div id="pl" class="m">লোড হচ্ছে…</div>';
  if(PT==='c'){ var d=await q('বাকি', db.from('v_orders').select('customer_id,due').gt('due',0)); S.dueMap={}; d.forEach(function(x){ S.dueMap[x.customer_id]=(S.dueMap[x.customer_id]||0)+(+x.due); }); }
  drawPeople();
}
function drawPeople(){
  var s=val('pq').toLowerCase();
  if(PT==='c'){ var rows=S.customers.filter(function(c){return !s||(c.name+' '+(c.phone||'')+' '+c.id).toLowerCase().indexOf(s)>=0;});
    el('pl').innerHTML=rows.map(function(c){ var due=(S.dueMap[c.id]||0)+(+c.opening_due||0);
      return '<div class="item"><div class="b"><div class="between"><span class="t">'+esc(c.name)+'</span>'+(due>0?'<b class="red">বাকি '+money(due)+'</b>':'<span class="m">—</span>')+'</div>'+
        '<div class="between"><span class="m">'+c.id+' · '+esc(c.phone||'')+'</span>'+(c.phone?'<button class="small wa" onclick="event.stopPropagation();openWA(\''+esc(c.phone)+'\',\'আসসালামু আলাইকুম '+esc(c.name)+', '+esc(S.settings.company_name||'LorVe')+' থেকে বলছি।\')">💬</button>':'')+'</div></div></div>'; }).join('')||'<div class="card m">কেউ নেই</div>'; }
  else { var rs=S.suppliers.filter(function(x){return !s||(x.name+' '+(x.phone||'')).toLowerCase().indexOf(s)>=0;});
    el('pl').innerHTML=rs.map(function(x){ return '<div class="item"><div class="b"><div class="between"><span class="t">'+esc(x.name)+'</span><span class="pill">'+esc(x.kind)+'</span></div><div class="m">'+x.id+' · '+esc(x.country||'')+' · '+esc(x.phone||'')+'</div></div></div>'; }).join('')||'<div class="card m">কেউ নেই</div>'; }
}

/* ═══════════════════ রিপোর্ট ═══════════════════ */
async function vReport(){
  el('view').innerHTML=chips('vReport')+'<div id="rp" class="m">লোড হচ্ছে…</div>';
  try{ var r=range();
    var o=await q('বিক্রি', db.from('v_orders').select('id,status,grand_total,cogs,profit,courier_cost').gte('order_date',r[0]).lte('order_date',r[1]));
    var live=o.filter(function(x){return ['Cancelled','Returned'].indexOf(x.status)<0;}), ids=live.map(function(x){return x.id;});
    var ex=await q('খরচ', db.from('expenses').select('amount').gte('exp_date',r[0]).lte('exp_date',r[1]));
    var it=ids.length?await q('প্রোডাক্ট', db.from('order_items').select('sku,qty,unit_price,unit_cost').in('order_id',ids)):[];
    var sales=live.reduce(function(a,x){return a+(+x.grand_total);},0), cogs=live.reduce(function(a,x){return a+(+x.cogs);},0),
        profit=live.reduce(function(a,x){return a+(+x.profit);},0), exp=ex.reduce(function(a,x){return a+(+x.amount);},0);
    var pm={}; it.forEach(function(l){ var p=pm[l.sku]||(pm[l.sku]={q:0,r:0,c:0}); p.q+=l.qty; p.r+=l.qty*l.unit_price; p.c+=l.qty*l.unit_cost; });
    var top=Object.keys(pm).map(function(s){return {sku:s,q:pm[s].q,r:pm[s].r,p:pm[s].r-pm[s].c};}).sort(function(a,b){return b.r-a.r;}).slice(0,10);
    el('rp').innerHTML='<div class="kpis">'+kpi('💰 বিক্রি',k(sales),'linear-gradient(135deg,#0A84FF,#0060df)')+kpi('📦 পণ্যের খরচ',k(cogs),'linear-gradient(135deg,#8E8E93,#555)')+
      kpi('📈 গ্রস লাভ',k(profit),'linear-gradient(135deg,#30D158,#1a8c3a)')+kpi('🏁 নেট লাভ',k(profit-exp),'linear-gradient(135deg,#BF5AF2,#7d29ad)')+'</div>'+
      '<div class="card"><div class="between"><span class="m">অর্ডার</span><b>'+live.length+'</b></div><div class="between"><span class="m">খরচ (ভাড়া, বেতন…)</span><b>'+money(exp)+'</b></div>'+
      '<div class="between"><span class="m">মার্জিন</span><b>'+(sales?((profit-exp)/sales*100).toFixed(1):0)+'%</b></div></div>'+
      '<div class="sec-t">টপ প্রোডাক্ট</div><div class="card">'+(top.length?'<table><tr><th>পণ্য</th><th class="n">Qty</th><th class="n">বিক্রি</th><th class="n">লাভ</th></tr>'+top.map(function(t){
        return '<tr><td>'+esc(prodName(t.sku))+'</td><td class="n">'+t.q+'</td><td class="n">'+money(t.r)+'</td><td class="n green">'+money(t.p)+'</td></tr>';}).join('')+'</table>':'<div class="m">এই সময়ে বিক্রি নেই</div>')+'</div>';
  }catch(e){ el('rp').innerHTML='<div class="err">'+esc(e.message)+'</div>'; }
}

/* ═══════════════════ সেটিংস ═══════════════════ */
var ST='co';
async function vSettings(){
  el('view').innerHTML='<div class="chips">'+[['co','🏢 কোম্পানি'],['team','👥 টিম'],['me','🔑 আমার password']].map(function(t){return '<button class="'+(ST===t[0]?'on':'')+'" onclick="ST=\''+t[0]+'\';vSettings()">'+t[1]+'</button>';}).join('')+'</div><div id="stb"></div>';
  if(ST==='co'){
    var keys=[['company_name','কোম্পানির নাম'],['company_tagline','ট্যাগলাইন'],['company_address','ঠিকানা'],['company_phone','ফোন'],['company_email','ইমেইল'],['company_web','ওয়েবসাইট'],['fx_usd','১ USD = কত টাকা'],['invoice_footer','ইনভয়েসের নিচের লেখা'],['invoice_terms','শর্তাবলী (| দিয়ে আলাদা)']];
    el('stb').innerHTML='<div class="card">'+keys.map(function(x){return '<label>'+x[1]+'</label><input id="set-'+x[0]+'" value="'+esc(S.settings[x[0]]||'')+'">';}).join('')+'</div><button class="full" onclick="saveSettings()">সেভ</button>';
  } else if(ST==='team'){
    var t=await q('টিম', db.from('staff').select('*').order('created_at'));
    el('stb').innerHTML='<div class="card m">নতুন কর্মী login পাতায় "নতুন কর্মী?" থেকে account খুলবে — তারপর এখানে তাকে চালু করবেন</div>'+t.map(function(u){
      var self=u.id===S.user.id;
      return '<div class="card"><div class="between"><b>'+esc(u.name||u.email)+'</b><span class="pill '+(u.status==='Active'?'ok':(u.status==='Locked'?'low':'out'))+'">'+esc(u.status)+'</span></div>'+
        '<div class="m">'+esc(u.email)+(u.last_login?' · শেষ login '+nice(u.last_login):'')+'</div>'+
        (self?'<div class="m">(আপনি)</div>':'<div class="row" style="margin-top:8px"><select id="tb-'+u.id+'">'+opts(Object.keys(BOARDS),u.board)+'</select>'+
        '<select id="ts-'+u.id+'">'+opts(['Active','Locked','Blocked'],u.status)+'</select><button class="sec" style="flex:0 0 70px" onclick="saveStaff(\''+u.id+'\')">সেভ</button></div>')+'</div>'; }).join('');
  } else {
    el('stb').innerHTML='<div class="card"><label>নতুন password</label><input id="np1" type="password"><label>আবার লিখুন</label><input id="np2" type="password"></div><button class="full" onclick="changePass()">বদলান</button>';
  }
}
async function saveSettings(){
  try{ var keys=Object.keys(S.settings).concat(['company_web']); var rows=[];
    document.querySelectorAll('[id^="set-"]').forEach(function(i){ rows.push({key:i.id.slice(4),value:i.value}); });
    await q('সেভ', db.from('settings').upsert(rows)); await loadMaster(); toast('✅ সেভ'); }catch(e){ fail(e); } }
async function saveStaff(id){ try{ await q('টিম', db.from('staff').update({board:val('tb-'+id),status:val('ts-'+id)}).eq('id',id)); toast('✅ সেভ'); vSettings(); }catch(e){ fail(e); } }
async function changePass(){ if(el('np1').value!==el('np2').value){ toast('দুটো মিলছে না'); return; }
  var r=await db.auth.updateUser({password:el('np1').value}); toast(r.error?'⚠️ '+r.error.message:'✅ Password বদলে গেছে'); }

start();
</script>
