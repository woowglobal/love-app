async function mBudget(){
  var res=await Promise.all([ q('Months', db.from('v_month_pl').select('*').order('month',{ascending:false}).limit(7)),
    q('Categories', db.from('v_expense_month').select('*').order('month',{ascending:false}).limit(120)),
    q('Recurring', db.from('recurring_expenses').select('*').eq('active',true)),
    q('Budget', db.from('budgets').select('*').order('month',{ascending:false}).limit(60)) ]);
  var pl=res[0].slice().reverse(), cat=res[1], rec=res[2], bud=res[3];
  var nm=new Date(); nm.setMonth(nm.getMonth()+1); nm.setDate(1);
  var nextM=nm.toISOString().slice(0,10), thisM=monthStart();
  // forecast = average of last 3 months per category, fixed costs win where they exist
  var last3={}, seen={};
  cat.forEach(function(c){ var m=String(c.month).slice(0,10); if(m===thisM) return;
    if(!seen[m]) seen[m]=1;
    if(Object.keys(seen).length<=3){ last3[c.category]=(last3[c.category]||0)+(+c.amount||0); } });
  var nseen=Math.max(1,Math.min(3,Object.keys(seen).length));
  var fc={}; Object.keys(last3).forEach(function(c){ fc[c]=Math.round(last3[c]/nseen); });
  rec.forEach(function(r){ fc[r.category]=Math.max(fc[r.category]||0, +r.amount||0); });
  var fcTot=Object.keys(fc).reduce(function(a,c){return a+fc[c];},0);
  var avgSales=pl.length?pl.slice(-3).reduce(function(a,x){return a+(+x.sales||0);},0)/Math.min(3,pl.length):0;
  var budMap={}; bud.filter(function(b){return String(b.month).slice(0,10)===nextM;}).forEach(function(b){ budMap[b.category]=+b.amount; });
  var thisCat={}; cat.filter(function(c){return String(c.month).slice(0,10)===thisM;}).forEach(function(c){ thisCat[c.category]=+c.amount; });
  var W=600,H=190, mx=Math.max(1,Math.max.apply(null,pl.map(function(x){return Math.max(+x.sales||0,(+x.cogs||0)+(+x.expense||0));})));
  var bw=W/Math.max(1,pl.length);
  var bars=pl.map(function(x,i){ var hs=(+x.sales||0)/mx*(H-30), he=((+x.cogs||0)+(+x.expense||0))/mx*(H-30);
    return '<rect x="'+(i*bw+bw*.16)+'" y="'+(H-20-hs)+'" width="'+(bw*.3)+'" height="'+Math.max(hs,1)+'" rx="4" fill="#14534a"/>'+
           '<rect x="'+(i*bw+bw*.54)+'" y="'+(H-20-he)+'" width="'+(bw*.3)+'" height="'+Math.max(he,1)+'" rx="4" fill="#b0645a"/>'+
           '<text x="'+(i*bw+bw/2)+'" y="'+(H-6)+'" font-size="10" fill="#6d7c75" text-anchor="middle">'+new Date(x.month).toLocaleDateString('en-GB',{month:'short'})+'</text>'; }).join('');
  el('mny').innerHTML=
    '<div class="card"><div class="between"><b>Income vs cost · last months</b><span class="m">▮ Income · ▮ Cost + expense</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:200px;margin-top:8px">'+bars+'<line x1="0" y1="'+(H-20)+'" x2="'+W+'" y2="'+(H-20)+'" stroke="#e4e9e4"/></svg>'+
    '<div style="overflow-x:auto;margin-top:8px"><table><tr><th>Month</th><th class="n">Sales</th><th class="n">Goods</th><th class="n">Expenses</th><th class="n">Net</th></tr>'+
    pl.slice().reverse().map(function(x){ return '<tr><td>'+new Date(x.month).toLocaleDateString('en-GB',{month:'short',year:'numeric'})+'</td><td class="n">'+money(x.sales)+'</td><td class="n">'+money(x.cogs)+'</td>'+
      '<td class="n">'+money(x.expense)+'</td><td class="n '+((+x.net_profit)>=0?'green':'red')+'">'+money(x.net_profit)+'</td></tr>'; }).join('')+'</table></div></div>'+
    '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'+
    kpi2('🔮 Forecast cost', k(fcTot), 'next month','linear-gradient(135deg,#b0645a,#8c4a42)','')+
    kpi2('📈 Expected sales', k(avgSales), '3-month average','linear-gradient(135deg,#14534a,#0e3b34)','')+
    kpi2('🏁 Expected net', k(avgSales*0.35-fcTot), 'rough guide','linear-gradient(135deg,#4b5d73,#34465a)','')+'</div>'+
    '<div class="card"><div class="between"><b>📊 Budget · '+new Date(nextM).toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</b><button class="small" onclick="saveBudget(\''+nextM+'\')">Save budget</button></div>'+
    '<div class="m" style="margin:6px 0">Forecast is the 3-month average, with fixed costs applied. Change any number to set your budget.</div>'+
    '<table><tr><th>Category</th><th class="n">This month</th><th class="n">Forecast</th><th class="n">Budget</th></tr>'+
    (S.expCats||[]).concat(Object.keys(fc).filter(function(c){return (S.expCats||[]).indexOf(c)<0;})).map(function(c){
      return '<tr><td>'+esc(c)+'</td><td class="n">'+money(thisCat[c]||0)+'</td><td class="n">'+money(fc[c]||0)+'</td>'+
        '<td class="n"><input class="bud" data-c="'+esc(c)+'" inputmode="decimal" style="width:110px;padding:7px" value="'+(budMap[c]!=null?budMap[c]:(fc[c]||''))+'"></td></tr>'; }).join('')+
    '</table></div>'+
    '<button class="full sec" onclick="printBudget()">🖨️ Print income vs expense</button>';
  S.pl=pl; S.fc=fc; S.nextM=nextM;
}

function audience(){
  var m=new Date().getMonth(), s=(CP.q||'').toLowerCase(), top=S.cstats.slice().sort(function(a,b){return b.spent-a.spent;}).slice(0,Math.max(5,Math.ceil(S.cstats.length*0.2))).map(function(c){return c.id;});
  var days=function(d){ return d?(Date.now()-new Date(d))/86400000:9999; };
  return S.cstats.filter(function(c){
    if(CP.area && c.area!==CP.area) return false;
    if(CP.buyers && !CP.buyers[c.id]) return false;
    if(s && (c.name+' '+(c.phone||'')+' '+(c.email||'')).toLowerCase().indexOf(s)<0) return false;
    switch(CP.seg){
      case 'new': return days(c.last_order)<=30;
      case 'old': return c.orders>0 && days(c.last_order)>90;
      case 'due': return c.due>0;
      case 'top': return top.indexOf(c.id)>=0;
      case 'wholesale': return ['Wholesale','Reseller','Corporate'].indexOf(c.type)>=0;
      case 'retail': return !c.type || c.type==='Retail';
      case 'bday': return c.birthday && new Date(c.birthday).getMonth()===m;
      case 'never': return !c.orders;
      case 'pick': return true;
    }
    return true;
  });
}

async function sendEmails(msgs){
  var r=await db.functions.invoke('send-email',{ body:{ messages:msgs, by:S.staff.name||S.staff.email, replyTo:S.settings.email_reply_to||S.settings.company_email||undefined } });
  if(r.error){
    var m=r.error.message||String(r.error), ctx=r.error.context;
    try{
      if(ctx && typeof ctx.json==='function'){ var j=await ctx.clone().json(); if(j&&j.error) m=j.error; }
      else if(ctx && typeof ctx.text==='function'){ var t=await ctx.clone().text(); if(t) m=t.slice(0,300); }
      else if(ctx && ctx.status){ m='Edge Function error '+ctx.status+(ctx.statusText?' · '+ctx.statusText:''); }
    }catch(e){}
    if(/not found|404/i.test(m)) m='The "send-email" function is not deployed in Supabase yet';
    if(/GMAIL_USER|GMAIL_APP_PASSWORD|BREVO/i.test(m)) m='Email keys are missing: set GMAIL_USER and GMAIL_APP_PASSWORD in Supabase → Edge Functions → Secrets';
    if(/অনুমতি|403/i.test(m)) m='Not allowed — log out and log in again';
    throw new Error(m);
  }
  if(r.data && r.data.error) throw new Error(r.data.error);
  return r.data;
}

    '<div class="card"><div class="between"><b>🎂 Birthdays today</b><span class="pill">'+bdays.length+' people</span></div>'+
    (bdays.length?bdays.map(function(c){return '<div class="between line"><span>'+esc(c.name)+'</span><button class="small sec" onclick="MT=\'camp\';CP={type:\'greet\',seg:\'pick\',sel:{\''+c.id+'\':true},_touched:1,skus:[],disc:{},q:\'\'};vMessage()">🎉 Send</button></div>';}).join(''):'<div class="m">No birthdays today · add customer birthdays in the "People" screen</div>')+'</div>'+
    '<div class="card"><div class="between"><b>🆕 New stock announcement</b><span class="pill b">'+sh.length+' Shipment</span></div><div class="m" style="margin:6px 0">Shipments received in the last 7 days — announce with photos and prices in one tap</div>'+

async function saveStaff(id){
  var sc=[]; document.querySelectorAll('.ed-sc').forEach(function(c){ if(c.checked) sc.push(c.value); });
  try{ await q('Team', db.from('staff').update({name:val('ed-name'),board:val('ed-board'),status:val('ed-st'),screens:sc}).eq('id',id));
    closeModal(); toast('✅ Saved'); stTeam(); }catch(e){ fail(e); }
}
function formStaff(){
  var pw='Lv'+Math.random().toString(36).slice(2,8)+Math.floor(10+Math.random()*89);
  modal('<h3 style="margin:0 0 10px">➕ Add new staff</h3><div class="card">'+
    '<label>Name</label><input id="ns-name" placeholder="Bhuiyan SIYAM">'+
    '<label>Email (the staff member’s own)</label><input id="ns-email" type="email" placeholder="siyam@gmail.com">'+
    '<label>Initial password</label><input id="ns-pass" value="'+pw+'">'+
    '<div class="m">Staff can change it later from Settings → Password</div>'+
    '<label>Board</label><select id="ns-board" onchange="el(\'ns-hint\').textContent=boardScreens(this.value)">'+opts(Object.keys(BOARDS),'Seller board')+'</select>'+
    '<div class="m" id="ns-hint" style="margin-top:6px">'+esc(boardScreens('Seller board'))+'</div></div>'+
    '<button class="full" onclick="saveNewStaff()">Create</button>');
}
async function saveNewStaff(){
  var name=val('ns-name'), email=val('ns-email').toLowerCase(), pass=val('ns-pass'), board=val('ns-board');
  if(!name||email.indexOf('@')<1){ toast('Enter name and a valid email'); return; }
  if(pass.length<6){ toast('Password must be at least 6 characters'); return; }
  try{
    var tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{db:{schema:'lorve'},auth:{persistSession:false,autoRefreshToken:false,storageKey:'lorve-new-staff'}});
    var r=await tmp.auth.signUp({email:email,password:pass});
    if(r.error) throw r.error;
    if(!r.data.session){ toast('⚠️ Turn off "Confirm email" in Supabase, then try again'); return; }
    var q1=await tmp.rpc('request_access',{p_name:name});
    if(q1.error) throw q1.error;
    await tmp.auth.signOut();
    await q('Team', db.from('staff').update({name:name,board:board,status:'Active'}).eq('email',email));
    var link=location.href.split('?')[0].split('#')[0];
    var msg='Assalamu Alaikum '+name+',\n'+(S.settings.company_name||'LorVe')+' app account has been created ✅\n\nLink: '+link+'\nEmail: '+email+'\nPassword: '+pass+'\nBoard: '+board+'\n\nAfter first login, set your own password from Settings → Password.';
    modal('<h3 style="margin:0 0 10px">✅ '+esc(name)+' created</h3><div class="card">'+
      '<div class="between line"><span class="m">Email</span><b>'+esc(email)+'</b></div>'+
      '<div class="between line"><span class="m">Password</span><b>'+esc(pass)+'</b></div>'+
      '<div class="between line"><span class="m">Board</span><b>'+esc(board)+'</b></div></div>'+
      '<div class="row"><button class="wa" onclick="openWA(prompt(\'Staff WhatsApp number:\')||\'\','+esc(JSON.stringify(JSON.stringify(msg)))+')">💬 WhatsApp</button>'+
      '<button class="sec" onclick="navigator.clipboard&&navigator.clipboard.writeText('+esc(JSON.stringify(JSON.stringify(msg)))+');toast(\'📋 Copied\')">📋 Copy</button></div>');
    if(S.view==='settings'&&ST==='team') stTeam();
  }catch(e){
    var m=String(e.message||e);
    toast(m.indexOf('registered')>=0?'⚠️ An account already exists for this email':'⚠️ '+m);
  }
}
function stWa(){
  var keys=[['wa_senders','Sender numbers (| separated, e.g. +8801XXXXXXXXX|+13477443867)'],['wa_tpl_order','Order confirmation'],['wa_tpl_pay','Payment received'],['wa_tpl_delivery','Parcel shipped'],['wa_tpl_due','Payment reminder'],['wa_tpl_chat','General']];
  el('stb').innerHTML='<div class="card m">Available in templates: <b>{name} {order} {total} {due} {amount} {courier} {tracking} {company}</b></div><div class="card">'+keys.map(function(x){return '<label>'+x[1]+'</label><textarea class="setv" data-k="'+x[0]+'" rows="'+(x[0]==='wa_senders'?2:4)+'">'+esc((S.settings[x[0]]||'').replace(/\\n/g,'\n'))+'</textarea>';}).join('')+'</div><button class="full" onclick="saveSet()">Save</button>';
}
function stBk(){
  el('stb').innerHTML='<div class="card"><b>💾 Backup</b><div class="m" style="margin:6px 0 12px">Download all data as a single file (JSON). Supabase also keeps a daily database backup.</div><button class="full" onclick="backup()">⬇️ Download backup now</button></div>';
}
async function backup(){
  var tabs=['products','customers','suppliers','accounts','orders','order_items','payments','expenses','deliveries','shipments','shipment_items','stock_moves','settings','chat_log'], out={at:new Date().toISOString()};
  try{ for(var i=0;i<tabs.length;i++){ out[tabs[i]]=await q(tabs[i], db.from(tabs[i]).select('*')); }
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
    a.download='lorve-backup-'+today()+'.json'; a.click(); toast('✅ Backup downloaded'); }catch(e){ fail(e); }
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
start();
</script>
